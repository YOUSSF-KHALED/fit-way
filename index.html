<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Food Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050505; overflow-x: hidden; font-family: 'Cairo', sans-serif; color: white; }

        .section {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* توهج الخلفية */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            z-index: 1;
        }
        .healthy-glow { background: #22c55e; }
        .unhealthy-glow { background: #ef4444; }

        .food-container {
            position: relative;
            z-index: 10;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .food-img {
            width: 100%;
            height: auto;
            /* لو الصورة مش موجودة، الـ CSS ده هيعمل دايرة بديلة عشان الموقع ميبوظش */
            background-color: rgba(255,255,255,0.05);
            border-radius: 50%;
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.9));
        }

        .text-content { z-index: 20; text-align: center; margin-top: 30px; }
        h1 { font-size: 4.5rem; text-transform: uppercase; line-height: 0.8; margin-bottom: 10px; font-weight: 900; }
        
        .particle { position: absolute; border-radius: 50%; z-index: 2; pointer-events: none; }
    </style>
</head>
<body>

    <!-- الجزء الصحي -->
    <section class="section healthy">
        <div class="glow healthy-glow"></div>
        <div class="food-container">
            <!-- صورة سلطة مؤقتة - استبدلها بـ healthy.png في فولدر مشروعك -->
            <img src="https://www.pngmart.com/files/1/Salad-PNG-Transparent-Image.png" 
                 onerror="this.src='https://via.placeholder.com/300/22c55e/ffffff?text=Healthy+Food'" 
                 class="food-img" id="healthy-food">
        </div>
        <div class="text-content">
            <h1 style="color: #22c55e;">HEALTHY</h1>
            <p>خـليـك مـثـالـي</p>
        </div>
    </section>

    <!-- الجزء غير الصحي -->
    <section class="section unhealthy">
        <div class="glow unhealthy-glow"></div>
        <div class="food-container">
            <!-- صورة برجر مؤقتة - استبدلها بـ burger.png في فولدر مشروعك -->
            <img src="https://www.pngmart.com/files/1/Burger-Sandwich-PNG-Transparent-Image.png" 
                 onerror="this.src='https://via.placeholder.com/300/ef4444/ffffff?text=Tasty+Burger'"
                 class="food-img" id="unhealthy-food">
        </div>
        <div class="text-content">
            <h1 style="color: #ef4444;">INDULGE</h1>
            <p>دلع الـكـرش</p>
        </div>
    </section>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        window.onload = () => {
            // انيميشن السلطة (النزول والدوران)
            gsap.from("#healthy-food", {
                y: -1000,
                rotation: 360,
                duration: 1.8,
                ease: "expo.out",
                opacity: 0
            });

            createParticles(".healthy", "#22c55e");
            createParticles(".unhealthy", "#ef4444");
        };

        // انيميشن البرجر عند السكرول
        gsap.from("#unhealthy-food", {
            scrollTrigger: {
                trigger: ".unhealthy",
                start: "top 70%",
            },
            y: 1000,
            rotation: -360,
            duration: 1.8,
            ease: "expo.out",
            opacity: 0
        });

        function createParticles(selector, color) {
            const container = document.querySelector(selector);
            for (let i = 0; i < 40; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                const size = Math.random() * 5 + 2;
                p.style.width = size + "px";
                p.style.height = size + "px";
                p.style.backgroundColor = color;
                container.appendChild(p);
                
                gsap.set(p, {
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    opacity: Math.random() * 0.5
                });

                gsap.to(p, {
                    y: "-=" + (Math.random() * 200 + 100),
                    opacity: 0,
                    duration: Math.random() * 3 + 2,
                    repeat: -1,
                    ease: "none",
                    delay: Math.random() * 2
                });
            }
        }
    </script>
</body>
</html>
