<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Food Experience</title>
    <!-- مكتبة GSAP للأنيميشن الخارق -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #111; color: white; overflow-x: hidden; }

        .panel {
            height: 100vh;
            width: 100%;
            display: flex;
            position: relative;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* الخلفيات المتدرجة الفخمة */
        .healthy-panel {
            background: radial-gradient(circle at center, #1e3a1f 0%, #0a1a0b 100%);
        }

        .unhealthy-panel {
            background: radial-gradient(circle at center, #450a0a 0%, #1a0505 100%);
        }

        /* العناصر الطائرة (Calories & Tags) */
        .floating-tag {
            position: absolute;
            font-size: 8vw;
            font-weight: 900;
            text-transform: uppercase;
            color: rgba(255,255,255,0.03);
            z-index: 1;
            user-select: none;
        }

        /* صورة الوجبة - احترافية */
        .food-wrapper {
            position: relative;
            z-index: 5;
            transform: translateZ(50px);
        }

        .food-img {
            width: 320px;
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.5));
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .food-img:hover { transform: scale(1.1) rotate(5deg); }

        .content {
            text-align: center;
            z-index: 10;
            margin-top: -20px;
        }

        h1 { font-size: 4rem; text-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .calories-badge {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 5px 20px;
            border-radius: 50px;
            font-size: 1rem;
            margin-bottom: 10px;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-premium {
            margin-top: 25px;
            padding: 18px 50px;
            border: none;
            border-radius: 5px; /* شكل مودرن أكتر */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            background: white;
            color: black;
        }

        .healthy-panel .btn-premium { color: #166534; }
        .unhealthy-panel .btn-premium { color: #991b1b; }

        /* أوراق الشجر */
.leaf {
    position: absolute;
    font-size: 2rem;
    filter: blur(1px);
    opacity: 0.6;
    z-index: 1;
}
.leaf-1 { top: 15%; left: 10%; }
.leaf-2 { bottom: 20%; right: 15%; }

/* بقع الصوص للقسم غير الصحي */
.sauce-drop {
    position: absolute;
    width: 100px;
    height: 100px;
    background: #ef4444;
    border-radius: 50%;
    filter: blur(40px); /* بتعمل إحساس بقعة الصوص الناعمة */
    opacity: 0.2;
    z-index: 1;
}
.drop-1 { top: 20%; right: 5%; }
.drop-2 { bottom: 15%; left: 10%; }

.floating-circle {
    position: absolute;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    padding: 20px;
    font-size: 0.8rem;
    opacity: 0.3;
}
    </style>
</head>
<body>

    <!-- قسم الصحي -->
    <section class="panel healthy-panel">
        <div class="floating-tag tag-1">450 KCAL</div>
        <div class="floating-tag tag-2" style="bottom: 10%; left: 0;">ORGANIC</div>
        
        <div class="food-wrapper">
            <img src="https://pngimg.com/uploads/salad/salad_PNG2816.png" class="food-img" alt="Salad">
        </div>
        
        <div class="content">
            <div class="calories-badge">فيتامينات + ألياف عالية</div>
            <h1>مـثـالي</h1>
            <button class="btn-premium">اكتشف القائمة</button>
        </div>
        <div class="leaf leaf-1">🍃</div>
<div class="leaf leaf-2">🌿</div>
<div class="floating-circle">Low Fat</div>
    </section>

    <!-- قسم غير الصحي -->
    <section class="panel unhealthy-panel">
        <div class="floating-tag tag-3">CHEESE BOMB</div>
        <div class="floating-tag tag-4" style="top: 20%; left: -5%;">JUICY</div>

        <div class="food-wrapper">
            <img src="https://pngimg.com/uploads/burger_sandwich/burger_sandwich_PNG4135.png" class="food-img" alt="Burger">
        </div>

        <div class="content">
            <div class="calories-badge">دبل تشيز + صوص سري</div>
            <h1>إجــرام</h1>
            <button class="btn-premium">اطلب المتعة</button>
        </div>
        <div class="sauce-drop drop-1"></div>
<div class="sauce-drop drop-2"></div>
<div class="floating-word">CRUNCHY</div>
    </section>

    <script>
      // استبدل جزء الـ Script في الكود القديم بالده:

gsap.registerPlugin(ScrollTrigger);

// حركة الوجبة "أول ما الموقع يفتح"
window.addEventListener('load', () => {
    gsap.from(".healthy-panel .food-img", {
        y: -500,          // تنزل من فوق الشاشة
        rotation: 360,    // تلف دورة كاملة
        opacity: 0,       // تبدأ شفافة
        duration: 2,      // تاخد ثانيتين
        ease: "bounce.out" // تأثير ارتداد خفيف لما تستقر
    });

    gsap.from(".unhealthy-panel .food-img", {
        scrollTrigger: {
            trigger: ".unhealthy-panel",
            start: "top center",
        },
        y: 500,           // دي تطلع من تحت لفوق لما توصل لها
        rotation: -360,   // تلف عكس الاتجاه
        opacity: 0,
        duration: 1.5,
        ease: "expo.out"
    });
});
// حركة خفيفة مستمرة لأوراق الشجر وبقع الصوص (Floating Animation)
gsap.to(".leaf, .sauce-drop", {
    y: "random(-20, 20)",
    x: "random(-20, 20)",
    rotation: "random(-15, 15)",
    duration: "random(2, 4)",
    repeat: -1,
    yoyo: true,
    ease: "sine.inOut"
});

// Parallax تأثير للسعرات والكلمات اللي في الخلفية مع السكرول
gsap.to(".floating-tag", {
    scrollTrigger: {
        scrub: true
    },
    y: (i, target) => -ScrollTrigger.maxScroll(window) * 0.1, // تتحرك ببطء عكس السكرول
    ease: "none"
});
    </script>
</body>
</html>
