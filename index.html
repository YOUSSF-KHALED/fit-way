<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Food Concept</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050505; overflow-x: hidden; font-family: 'Cairo', sans-serif; color: white; }
        .section { height: 100vh; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .glow { position: absolute; width: 400px; height: 400px; border-radius: 50%; filter: blur(120px); opacity: 0.3; z-index: 1; }
        .healthy-glow { background: #22c55e; }
        .unhealthy-glow { background: #ef4444; }
        .food-container { position: relative; z-index: 10; width: 300px; height: 300px; display: flex; justify-content: center; align-items: center; }
        .food-img { width: 100%; height: auto; filter: drop-shadow(0 20px 50px rgba(0,0,0,0.9)); }
        .text-content { z-index: 20; text-align: center; margin-top: 30px; }
        h1 { font-size: 4rem; text-transform: uppercase; font-weight: 900; }
        .particle { position: absolute; border-radius: 50%; z-index: 2; pointer-events: none; }
    </style>
</head>
<body>

    <!-- قسم HEALTHY -->
    <section class="section healthy">
        <div class="glow healthy-glow"></div>
        <div class="food-container">
            <!-- صورة SVG مدمجة لضمان التشغيل (سلطة جرافيك فخمة) -->
            <svg id="healthy-food" class="food-img" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><circle cx="256" cy="256" r="200" fill="#22c55e" opacity="0.2"/><path d="M400 256c0 79.5-64.5 144-144 144S112 335.5 112 256s64.5-144 144-144 144 64.5 144 144z" fill="#4ade80"/><path d="M320 160l-64 96-64-96z" fill="#166534"/></svg>
        </div>
        <div class="text-content">
            <h1 style="color: #22c55e;">HEALTHY</h1>
            <p>خـليـك مـثـالـي</p>
        </div>
    </section>

    <!-- قسم UNHEALTHY -->
    <section class="section unhealthy">
        <div class="glow unhealthy-glow"></div>
        <div class="food-container">
            <!-- صورة SVG مدمجة لضمان التشغيل (برجر جرافيك فخمة) -->
            <svg id="unhealthy-food" class="food-img" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><rect x="100" y="200" width="312" height="112" rx="20" fill="#facc15"/><rect x="80" y="160" width="352" height="60" rx="30" fill="#b45309"/><rect x="80" y="290" width="352" height="60" rx="10" fill="#b45309"/></svg>
        </div>
        <div class="text-content">
            <h1 style="color: #ef4444;">UNHEALTHY</h1>
            <p>دلع الـكـرش</p>
        </div>
    </section>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        window.onload = () => {
            gsap.from("#healthy-food", { y: -1000, rotation: 360, duration: 1.8, ease: "expo.out", opacity: 0 });
            createParticles(".healthy", "#22c55e");
            createParticles(".unhealthy", "#ef4444");
        };

        gsap.from("#unhealthy-food", {
            scrollTrigger: { trigger: ".unhealthy", start: "top 70%" },
            y: 1000, rotation: -360, duration: 1.8, ease: "expo.out", opacity: 0
        });

        function createParticles(selector, color) {
            const container = document.querySelector(selector);
            for (let i = 0; i < 30; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                const size = Math.random() * 5 + 2;
                p.style.width = size + "px"; p.style.height = size + "px"; p.style.backgroundColor = color;
                container.appendChild(p);
                gsap.set(p, { x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, opacity: Math.random() * 0.5 });
                gsap.to(p, { y: "-=" + (Math.random() * 200 + 100), opacity: 0, duration: Math.random() * 3 + 2, repeat: -1, ease: "none" });
            }
        }
    </script>
</body>
</html>
